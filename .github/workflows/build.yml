name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip any .zip files and find build.gradle
        id: find
        run: |
          # Unzip every .zip in the repo into _unzipped/
          find . -name '*.zip' -not -path './.git/*' -not -path './_unzipped/*' -print0 |
            while IFS= read -r -d '' z; do
              echo "Unzipping: $z"
              unzip -oq "$z" -d _unzipped
            done

          # Prefer a project found inside an unzipped archive, else search the repo
          GRADLE_FILE=""
          if [ -d _unzipped ]; then
            GRADLE_FILE=$(find _unzipped -name build.gradle -not -path '*/node_modules/*' | sort | head -n 1)
          fi
          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find . -name build.gradle -not -path './.git/*' | sort | head -n 1)
          fi
          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::No build.gradle found anywhere in the repo or in any zip."
            find . -not -path './.git/*' | head -50
            exit 1
          fi

          DIR=$(dirname "$GRADLE_FILE")
          echo "Project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: dog-overlord-jar
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
          if-no-files-found: error
